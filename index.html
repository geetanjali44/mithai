
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

.methai-header {
  width: 100%;
  height: 390px;
  background: #17243B;
  position: relative;
}

.methai-logo {
  position: absolute;
  top: 60px;
  left: 35%;
  transform: translateX(-50%);
  font-family: 'Kalam', cursive;
  font-size: 92px;
  font-weight: 700;
  color: #E82B65;
  line-height: 1.2;
  white-space: nowrap;
}

/* MOBILE RESPONSIVE */
@media (max-width: 767px) {

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    width: 100%;
    overflow-x: hidden;
  }

  .methai-header {
    width: 100%;
    height: 350px;
    background: #17243B;
    position: relative;
  }

  .methai-logo {
    position: absolute;
        top: 50px;
        left: 25%;
        transform: none;
        font-size: 52px;
    line-height: 1.2;
    white-space: nowrap;
  }

  .methai-cream {
    width: 100%;
    height: 100px;
    overflow: hidden;
    background-color: transparent;
    background-image: none;
    line-height: 0;
  }

  .methai-cream svg {
    display: block;
    width: 400px;
    max-width: none;
    height: 100px;
  }

}

/* PREVENT MOBILE INPUT AUTO-ZOOM */
@media (max-width: 767px) {
  input,
  select,
  textarea {
    font-size: 16px;
  }
}

/* BOTH PC AND MOBILE */
.methai-cream {
  width: 100%;
  height: 100px;
  overflow: hidden;
  background: transparent;
  line-height: 0;
}

/* PC */
@media (min-width: 768px) {
  .methai-cream {

    background-size: 400px 100px;
    background-repeat: repeat-x;
  }

  .methai-cream svg {
    display: none;
  }
}

/* MOBILE */
@media (max-width: 767px) {
  .methai-cream svg {
    display: block;
    width: 100%;
    height: 100px;
  }
}



@media (max-width: 767px) {

  .methai-cream {
    position: relative;
    width: 100%;
    height: 99px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border: 0 !important;
    box-shadow: none !important;
    background: transparent !important;
  }

  .methai-cream svg {
    display: block;
    width: 400px;
    height: 100px;
    max-width: none;
    border: 0 !important;
  }

}

@media (max-width: 767px) {
  .methai-header {
    border: 0 !important;
    box-shadow: none !important;
  }

  .methai-cream {
    position: relative;
    margin-top: -2px !important;
    height: 100px !important;
    overflow: hidden;
    border: 0 !important;
    box-shadow: none !important;
    background: transparent !important;
  }

  .methai-cream svg {
    display: block;
    width: 400px;
    max-width: none;
    height: 100px;
    border: 0 !important;
  }
}


/* PC */
.methai-tagline {
  position: absolute;
  top: 180px;
  left: 15%;
  margin: 0;
  color: #FFFFFF;
  font-family: Arial, sans-serif;
  font-size: 60px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* MOBILE */
@media (max-width: 767px) {
      .methai-tagline {
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        padding: 0 10px;
        text-align: center;
        font-size: 30px;
        white-space: nowrap;
    }
}



/* PC */
.methai-delivery-boy {
  position: absolute;
    right: 15%;
    top: 80%;
    transform: translateY(-50%);
    width: 400px;
  height: auto;
  object-fit: contain;
  z-index: 2;
}

/* MOBILE */
@media (max-width: 767px) {
  .methai-delivery-boy {
        right: 50px;
        top: 105%;
        transform: translateY(-50%);
        width: 300px;
        height: auto;
  }
}


/* PC */
.mithai-store-buttons {
  position: absolute;
  top: 280px;
  left: 23%;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 5;
}

.mithai-store-buttons a {
  display: block;
  line-height: 0;
}

.mithai-store-buttons img {
  display: block;
  width: 155px;
  height: 48px;
  object-fit: contain;
  border: 0;
}

/* MOBILE */
@media (max-width: 767px) {
  .mithai-store-buttons {
    top: 178px;
    left: 50%;
    transform: translateX(-50%);
    gap: 8px;
    white-space: nowrap;
  }

  .mithai-store-buttons img {
    width: 125px;
    height: 38px;
  }
}

</style>
